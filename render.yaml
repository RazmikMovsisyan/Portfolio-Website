services:
  - type: web
    name: umami
    env: docker
    repo: https://github.com/umami-software/umami
    plan: free
    envVars:
      - key: DATABASE_TYPE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: umami-db
          property: connectionString

databases:
  - name: umami-db
    plan: free
